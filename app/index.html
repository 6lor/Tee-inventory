<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tee Inventory</title>
  <meta name="description" content="Stock and sales tracker for T-shirts and tote bags.">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tee Stock">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-mode="sell">
  <header class="topbar">
    <h1 id="title">Sell</h1>
    <span class="mode-pill" id="mode-pill"></span>
  </header>

  <main id="view"></main>

  <div id="basketbar" class="basketbar"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <section id="sheet" class="sheet" aria-hidden="true"></section>

  <nav class="tabs">
    <button class="tab" data-act="tab" data-tab="sell">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18l-1.5 12.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5z"/><path d="M8 7V6a4 4 0 0 1 8 0v1"/></svg>
      <span>Sell</span>
    </button>
    <button class="tab" data-act="tab" data-tab="stock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
      <span>Stock</span>
    </button>
    <button class="tab" data-act="tab" data-tab="products">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 3 6l2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 0 1-8 0z"/></svg>
      <span>Designs</span>
    </button>
    <button class="tab" data-act="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
